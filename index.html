/* Layout: top bar with live Kampala clock → hero (Luganda greeting, CTAs, live voice-agent demo | portrait over outlined surname) → career statement → stack as icon tiles → selected work cards with read-more dialog → experience → education & recognition → contact band → footer */
:root{
  --paper:#ffffff; --tint:#f3f6fd; --card:#ffffff; --ink:#0b1630; --ink-2:#4d5a78; --rule:#dbe2f1;
  --blue:#2457f5; --blue-2:#5b84ff; --blue-soft:#e6edff; --blue-ink:#1a3fc0;
  --panel:#0a1430; --panel-2:#13204a; --panel-fg:#eef2ff; --panel-muted:#9aa8cc;
  --band:#1d44d8; --band-2:#2a55ef;
  --s-card:#ffffff; --s-ink:#0b1630; --s-ink-2:#4d5a78; --s-rule:#dbe2f1; --s-blue:#2457f5; --s-soft:#e6edff; --s-blue-ink:#1a3fc0;
  --f-display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#070d1d; --tint:#0c1428; --card:#101a33; --ink:#e9eefc; --ink-2:#a2aeca; --rule:#1f2c4b;
  --blue:#5b84ff; --blue-2:#86a5ff; --blue-soft:#16244a; --blue-ink:#a9c0ff;
  --panel:#111c3a; --panel-2:#1a2850; --band:#16308f; --band-2:#1d3cab;
  --s-card:#101a33; --s-ink:#e9eefc; --s-ink-2:#a2aeca; --s-rule:#1f2c4b; --s-blue:#86a5ff; --s-soft:#16244a; --s-blue-ink:#a9c0ff; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#070d1d; --tint:#0c1428; --card:#101a33; --ink:#e9eefc; --ink-2:#a2aeca; --rule:#1f2c4b;
  --blue:#5b84ff; --blue-2:#86a5ff; --blue-soft:#16244a; --blue-ink:#a9c0ff;
  --panel:#111c3a; --panel-2:#1a2850; --band:#16308f; --band-2:#1d3cab;
  --s-card:#101a33; --s-ink:#e9eefc; --s-ink-2:#a2aeca; --s-rule:#1f2c4b; --s-blue:#86a5ff; --s-soft:#16244a; --s-blue-ink:#a9c0ff; color-scheme:dark }

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.02;text-wrap:balance}
p{margin:0}
a{color:inherit}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:6px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.02em}
.label{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.btn{display:inline-flex;align-items:center;gap:10px;padding:13px 22px;border-radius:12px;font-weight:600;font-size:15.5px;text-decoration:none;border:1.5px solid transparent;cursor:pointer;transition:transform .15s,background .15s,border-color .15s,color .15s}
.btn:hover{transform:translateY(-1px)}
.btn svg.i{width:18px;height:18px}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-ink)}
:root .btn-primary:hover{background:#1a3fc0}
.btn-line{border-color:var(--ink);color:var(--ink);background:transparent}
.btn-line:hover{background:var(--ink);color:var(--paper)}
.dl-msg{font-size:13px;color:var(--ink-2);min-height:1.2em}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:18px;border-bottom:1px solid var(--rule)}
.sig{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.03em;text-decoration:none;font-variation-settings:"wdth" 88}
.sig span{color:var(--blue)}
.topbar nav{display:flex;gap:26px;font-size:15px}
.topbar nav a{text-decoration:none;color:var(--ink-2)}
.topbar nav a:hover{color:var(--ink)}
.status{display:flex;align-items:center;gap:10px;color:var(--ink-2)}
.status .dot{width:8px;height:8px;border-radius:50%;background:#16a36a;box-shadow:0 0 0 4px rgba(22,163,106,.2)}

/* hero */
.hero{display:grid;grid-template-columns:1.08fr .92fr;gap:40px;padding-top:56px;position:relative}
.hero > div{position:relative;z-index:1}
.hero > .shapes{position:absolute;z-index:0}
.hero-l{min-width:0;display:flex;flex-direction:column;gap:24px;padding-bottom:64px}
.greet{font-size:clamp(60px,9vw,128px);font-weight:800;letter-spacing:-.045em;font-variation-settings:"wdth" 80;line-height:.88}
.greet em{font-style:normal;color:var(--blue)}
.gloss{display:flex;gap:14px;flex-wrap:wrap;color:var(--ink-2)}
.role-line{font-family:var(--f-mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.intro{font-size:clamp(19px,2vw,22px);line-height:1.5;max-width:31em}
.intro b{font-weight:700}
.ctas{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

.agent{background:var(--panel);color:var(--panel-fg);border-radius:20px;padding:20px;display:grid;gap:14px;max-width:580px;box-shadow:0 30px 60px -36px rgba(10,20,48,.75)}
.agent-top{display:flex;align-items:center;gap:12px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
:root .avatar{background:#2457f5}
.agent-top b{display:block;font-weight:600;font-size:15px}
.agent-top small{color:var(--panel-muted);font-family:var(--f-mono);font-size:11.5px}
.wave{margin-left:auto;display:flex;gap:3px;align-items:center;height:28px}
.wave i{width:3px;height:6px;border-radius:2px;background:#86a5ff;transition:height .15s}
.log{min-height:100px;display:grid;gap:8px;align-content:end}
.line{font-size:15px;line-height:1.5;max-width:94%}
.line.q{justify-self:end;background:rgba(255,255,255,.09);padding:7px 12px;border-radius:12px 12px 2px 12px;font-size:14px}
.line.a::before{content:"Agent  ";font-family:var(--f-mono);font-size:11px;color:#86a5ff;letter-spacing:.08em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font-size:13.5px;font-weight:500;color:var(--panel-fg);background:transparent;border:1px solid rgba(238,242,255,.25);border-radius:999px;padding:7px 13px;cursor:pointer;transition:background .15s,border-color .15s}
.chips button:hover{border-color:#86a5ff;background:rgba(91,132,255,.14)}
.chips button:disabled{opacity:.4;cursor:default}
.agent-foot{font-family:var(--f-mono);font-size:11px;color:var(--panel-muted)}

.hero-r{position:relative;align-self:start;min-width:0;min-height:580px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.surname{position:absolute;top:0;left:0;right:0;font-family:var(--f-display);font-weight:800;font-variation-settings:"wdth" 75;font-size:clamp(76px,10.5vw,150px);letter-spacing:-.05em;line-height:.8;text-align:center;color:transparent;-webkit-text-stroke:1.5px var(--blue);opacity:.55;user-select:none}
.surname span{display:block}
.slab{position:absolute;bottom:0;left:8%;right:8%;height:70%;background:linear-gradient(170deg,#3b6bff,#1d3fc4);border-radius:220px 220px 0 0}
.slab::after{content:"";position:absolute;inset:0;border-radius:inherit;background-image:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1px);background-size:18px 18px}
.hero-r img{position:relative;z-index:2;width:min(400px,84%);height:auto;display:block}
/* right column: portrait on top, a short statement that lines up with the agent card below it */
.hero-rcol{min-width:0;display:flex;flex-direction:column;padding-bottom:64px}
.hero-note{margin-top:auto;padding:28px 0 4px 28px;border-left:3px solid var(--blue);display:grid;gap:18px}
.hero-note .label{color:var(--blue)}
.hero-note p{font-family:var(--f-display);font-weight:700;font-variation-settings:"wdth" 85;font-size:clamp(28px,2.9vw,40px);line-height:1.08;letter-spacing:-.03em;text-wrap:balance}
.hero-note p em{font-style:normal;color:var(--blue)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:10px}
.steps li{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border:1px solid var(--rule);border-radius:999px;font-weight:600;font-size:14.5px;background:var(--card)}
.steps li span{font-family:var(--f-mono);font-size:11px;font-weight:500;color:#fff;background:var(--blue);border-radius:999px;padding:3px 7px}
.tagnote{position:absolute;z-index:3;right:0;top:46%;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:11px 15px;box-shadow:0 14px 28px -18px rgba(10,20,48,.5)}
.tagnote b{font-family:var(--f-display);font-size:17px;font-weight:700;display:block;line-height:1.15}
.tagnote .mono{color:var(--ink-2)}

/* sections */
section.s{--pad:104px;--fade:96px;padding-block:var(--pad);position:relative;overflow:hidden}
section.s > .wrap{position:relative;z-index:1}
/* blue bands feather into the neighbouring white sections instead of starting on a hard edge */
section.s.blue{margin-block:calc(-1 * var(--fade));padding-block:calc(var(--pad) + var(--fade));
  background:linear-gradient(var(--paper),color-mix(in srgb,var(--band) 55%,var(--paper)) calc(var(--fade) * .45),var(--band) var(--fade),var(--band) calc(100% - var(--fade)),color-mix(in srgb,var(--band) 55%,var(--paper)) calc(100% - var(--fade) * .45),var(--paper))}
section.s.blue > .shapes{-webkit-mask-image:linear-gradient(transparent,#000 var(--fade),#000 calc(100% - var(--fade)),transparent);mask-image:linear-gradient(transparent,#000 var(--fade),#000 calc(100% - var(--fade)),transparent)}
/* the first band sits under the hero portrait slab, so it keeps its top edge */
section.s.blue#statement{margin-top:0;padding-top:var(--pad);
  background:linear-gradient(var(--band),var(--band) calc(100% - var(--fade)),color-mix(in srgb,var(--band) 55%,var(--paper)) calc(100% - var(--fade) * .45),var(--paper))}
section.s.blue#statement > .shapes{-webkit-mask-image:linear-gradient(#000 calc(100% - var(--fade)),transparent);mask-image:linear-gradient(#000 calc(100% - var(--fade)),transparent)}
.blue{background:var(--band);color:#fff;
  --ink:#ffffff; --ink-2:#d4defd; --rule:rgba(255,255,255,.22); --blue:#ffffff; --blue-soft:rgba(255,255,255,.14); --blue-ink:#ffffff; --card:rgba(255,255,255,.07)}
.blue .label{color:#c9d6ff}
.surface{--card:var(--s-card); --ink:var(--s-ink); --ink-2:var(--s-ink-2); --rule:var(--s-rule); --blue:var(--s-blue); --blue-soft:var(--s-soft); --blue-ink:var(--s-blue-ink); color:var(--ink)}
.surface .label{color:var(--ink-2)}
.shapes{position:absolute;inset:0;pointer-events:none;z-index:0;color:var(--blue);overflow:hidden}
.shape{position:absolute;display:block;opacity:.22}
.shape svg{width:100%;height:100%;display:block;overflow:visible}
.blue .shape{opacity:.28}
.shape.solid{opacity:.12}
.s-head{display:grid;grid-template-columns:220px 1fr;gap:32px;margin-bottom:48px;align-items:end}
.s-head .label{padding-bottom:10px}
.s-head h2{font-size:clamp(40px,5.4vw,72px);font-weight:800;letter-spacing:-.04em;font-variation-settings:"wdth" 82}
.s-head h2 em{font-style:normal;color:var(--blue)}
.s-head p{color:var(--ink-2);margin-top:14px;max-width:40em}

/* statement */
.statement{display:grid;grid-template-columns:220px 1fr;gap:32px}
.statement blockquote{margin:0;font-family:var(--f-display);font-weight:500;font-size:clamp(24px,2.8vw,36px);line-height:1.28;letter-spacing:-.015em;font-variation-settings:"wdth" 92;text-wrap:pretty}
.statement blockquote mark{background:none;color:var(--blue);font-weight:700}.interests{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.interests:first-child{margin-top:0}
.interest{display:flex;align-items:center;gap:12px;padding:12px 18px 12px 12px;border:1.5px solid var(--ink);border-radius:14px;font-weight:600}
.interest span.ic{width:36px;height:36px;border-radius:10px;background:#fff;color:var(--band);display:grid;place-items:center}
.interest{background:rgba(255,255,255,.08)}
.interest small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--ink-2);font-weight:400;letter-spacing:.08em;text-transform:uppercase}

/* stack */
.groups{display:grid;gap:0;border-top:1.5px solid var(--ink)}
.group{display:grid;grid-template-columns:220px 1fr;gap:32px;padding:28px 0;border-bottom:1px solid var(--rule)}
.group h3{font-size:24px;font-weight:700;letter-spacing:-.01em;margin-top:6px}
.group .label{display:block}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tile{display:flex;align-items:center;gap:14px;padding:13px 14px;background:var(--card);border:1px solid var(--rule);border-radius:14px;min-width:0;transition:border-color .15s}
.tile:hover{border-color:var(--blue)}
.tile .ic{width:42px;height:42px;border-radius:11px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;flex:none}
.tile .ic svg.i{width:21px;height:21px}
.tile b{display:block;font-weight:600;font-size:15px;line-height:1.25}
.tile small{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.3;margin-top:2px}

/* work */
.work{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.proj{background:var(--card);border:1px solid var(--rule);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:box-shadow .2s;box-shadow:0 20px 40px -30px rgba(5,15,50,.6)}
.proj:hover{box-shadow:0 34px 60px -30px rgba(5,15,50,.75)}
.cover{aspect-ratio:16/9;position:relative;overflow:hidden;max-width:100%}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:20px 22px;color:#fff}
.ph::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.12) 1px,transparent 1px);background-size:18px 18px}
.ph .mk{position:relative;font-family:var(--f-display);font-weight:800;font-size:clamp(30px,4vw,48px);letter-spacing:-.04em;line-height:.9;font-variation-settings:"wdth" 80;max-width:80%}
.ph .frame{position:absolute;right:-6%;bottom:-14%;width:52%;aspect-ratio:16/10;border-radius:10px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);transform:rotate(-6deg)}
.ph .frame::before{content:"";position:absolute;left:10px;top:10px;width:40%;height:7px;border-radius:4px;background:rgba(255,255,255,.5);box-shadow:0 14px 0 -1px rgba(255,255,255,.3),0 28px 0 -1px rgba(255,255,255,.3)}
.ph small{position:relative;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.proj-body{padding:22px 24px 24px;display:flex;flex-direction:column;gap:10px;flex:1}
.proj-meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.proj-meta .label{color:var(--blue)}
.proj h3{font-size:28px;font-weight:700;letter-spacing:-.02em;font-variation-settings:"wdth" 88}
.proj p{color:var(--ink-2);font-size:15.5px}
.stack{display:flex;flex-wrap:wrap;gap:6px}
.stack span{font-family:var(--f-mono);font-size:11.5px;padding:4px 9px;border-radius:6px;background:var(--blue-soft);color:var(--blue-ink)}
.more{margin-top:auto;padding-top:8px}
.more button{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:0;color:var(--blue);font-weight:600;font-size:15px;cursor:pointer}
.more button:hover{text-decoration:underline;text-underline-offset:4px}

dialog{--card:var(--s-card); --ink:var(--s-ink); --ink-2:var(--s-ink-2); --rule:var(--s-rule); --blue:var(--s-blue); --blue-soft:var(--s-soft); --blue-ink:var(--s-blue-ink);border:0;padding:0;border-radius:22px;width:min(920px,calc(100vw - 32px));max-height:calc(100vh - 48px);background:var(--card);color:var(--ink);box-shadow:0 40px 80px -30px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(5,10,25,.6);backdrop-filter:blur(4px)}
.dlg{display:grid}
.dlg .cover{aspect-ratio:21/9}
.dlg-body{padding:28px;display:grid;gap:18px}
.dlg-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.dlg h3{font-size:clamp(28px,3.4vw,40px);font-weight:800;letter-spacing:-.03em;font-variation-settings:"wdth" 85}
.x{width:40px;height:40px;border-radius:50%;border:1px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer;display:grid;place-items:center;flex:none}
.dlg-cols{display:grid;grid-template-columns:1.4fr 1fr;gap:28px}
.dlg-cols > div{min-width:0}
.dlg ul{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.dlg li{padding-left:20px;position:relative;font-size:15px}
.dlg li::before{content:"";position:absolute;left:0;top:.62em;width:9px;height:2px;background:var(--blue)}
.dlg .facts{display:grid;gap:12px}
.dlg .facts div{display:grid;gap:2px;padding-bottom:12px;border-bottom:1px solid var(--rule)}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.shot{aspect-ratio:16/10;border-radius:12px;overflow:hidden;background:var(--tint);border:1px dashed var(--rule);display:grid;place-items:center;color:var(--ink-2);font-size:13px;text-align:center;max-width:100%}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot.has{border-style:solid}

/* experience */
.shift{display:grid;grid-template-columns:220px 1fr 1.25fr;gap:32px;padding:34px 0;border-top:1.5px solid var(--ink)}
.shift:last-child{border-bottom:1.5px solid var(--ink)}
.shift .when{font-family:var(--f-mono);font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.shift .when b{display:block;font-family:var(--f-display);font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1;margin-bottom:6px;color:var(--ink)}
.shift .when b.now{color:var(--blue)}
.shift h3{font-size:28px;font-weight:700;letter-spacing:-.02em;font-variation-settings:"wdth" 88}
.shift .role{color:var(--ink-2);margin-top:8px}
.shift ul{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:15.5px}
.shift li{padding-left:22px;position:relative}
.shift li::before{content:"";position:absolute;left:0;top:.62em;width:10px;height:2px;background:var(--blue)}

/* background */
.two{display:grid;grid-template-columns:1fr 1.25fr;gap:56px}
.two h3.t{font-size:24px;font-weight:700;margin-bottom:16px}
.edu > div{display:grid;grid-template-columns:96px 1fr;gap:16px;padding:16px 0;border-top:1px solid var(--rule)}
.edu .yr{font-family:var(--f-mono);font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;padding-top:3px}
.edu b{display:block;font-weight:600}
.edu span{color:var(--ink-2);font-size:14.5px}
.extras{display:flex;flex-wrap:wrap;gap:28px;margin-top:24px;padding-top:20px;border-top:1px solid var(--rule)}
.extras div{display:grid;gap:4px}
.awards{display:grid;gap:12px}
.award{background:var(--card);border:1px solid var(--rule);color:var(--ink);border-radius:16px;padding:20px 22px;display:grid;grid-template-columns:auto 1fr;gap:18px}
.seal{width:54px;height:54px;border-radius:50%;border:2px solid var(--blue);display:grid;place-items:center;font-family:var(--f-mono);font-size:10.5px;text-align:center;line-height:1.1;color:var(--blue);font-weight:500}
.award b{font-family:var(--f-display);font-size:19px;font-weight:700;display:block;line-height:1.15}
.award small{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2);display:block;margin:4px 0 8px}
.award p{font-size:14.5px;color:var(--ink-2)}

/* contact */
.call-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:end}
.call h2{font-size:clamp(50px,7.5vw,104px);font-weight:800;letter-spacing:-.045em;font-variation-settings:"wdth" 78;line-height:.88;margin-top:14px}
.call h2 em{font-style:normal;color:var(--blue)}
.call p.sub{font-size:18px;margin-top:20px;max-width:30em;color:var(--ink-2)}
.call .ctas{margin-top:28px}
.lines{border-top:2px solid var(--ink)}
.row{display:grid;grid-template-columns:90px 1fr auto;gap:14px;align-items:center;padding:16px 0;border-bottom:2px solid var(--ink)}
.row .label{font-size:11px}
.row .v{font-family:var(--f-display);font-size:clamp(19px,2.2vw,25px);font-weight:700;user-select:all;word-break:break-word;min-width:0}
.row button{font-family:var(--f-mono);font-size:12px;background:var(--blue);color:#fff;border:0;border-radius:999px;padding:8px 14px;cursor:pointer}

footer{--fade:96px;margin-top:calc(-1 * var(--fade));padding-top:var(--fade);background:linear-gradient(var(--paper),color-mix(in srgb,#0a1430 55%,var(--paper)) calc(var(--fade) * .45),#0a1430 var(--fade));color:#b8c3e2}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding-block:28px}
footer b{font-family:var(--f-display);font-size:24px;color:#fff;font-weight:700}
footer b span{color:#86a5ff}

@media (max-width:980px){
  .hero{grid-template-columns:1fr;gap:0}
  .hero-rcol{order:-1;padding-bottom:0}
  .hero-r{min-height:480px}
  .hero-note{display:none}
  .hero-l{padding-top:28px}
  .s-head,.statement,.group{grid-template-columns:1fr;gap:12px}
  .work{grid-template-columns:1fr}
  .shift{grid-template-columns:1fr 1fr;gap:20px}
  .shift ul{grid-column:1/-1}
  .two,.call-grid,.dlg-cols{grid-template-columns:1fr}
}
@media (max-width:640px){
  .topbar nav{display:none}
  .shift{grid-template-columns:1fr}
  .tagnote{top:auto;bottom:18px;right:4px}
  .row{grid-template-columns:1fr auto}
  .row .label{grid-column:1/-1}
  section.s{--pad:68px;--fade:60px}
  footer{--fade:60px}
  .tiles{grid-template-columns:1fr 1fr}
  .tile{flex-direction:column;align-items:flex-start;gap:10px}
  .dlg-body{padding:20px}
}

/* links + admin */
.linkrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.lnk{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1.5px solid var(--ink);border-radius:999px;text-decoration:none;font-weight:600;font-size:14px;color:var(--ink)}
.lnk:hover{background:var(--ink);color:var(--paper)}
.lnk svg.i{width:16px;height:16px}
.surface .lnk:hover,dialog .lnk:hover{color:var(--s-card)}
.socials{display:flex;flex-wrap:wrap;gap:8px}
.soc{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--ink);display:grid;place-items:center;color:var(--ink);text-decoration:none;transition:background .15s,color .15s,border-color .15s}
.soc:hover{background:var(--blue);border-color:var(--blue);color:#fff}
.soc svg.i{width:19px;height:19px}
footer .socials .soc{width:36px;height:36px;border-radius:10px;border-color:rgba(255,255,255,.3);color:#dbe3fa}
footer .socials .soc:hover{background:#2457f5;border-color:#2457f5;color:#fff}
footer .socials .soc svg.i{width:16px;height:16px}
.admin-link{font-family:var(--f-mono);font-size:11px;color:#6f7ea6;text-decoration:none;opacity:.55;background:none;border:0;cursor:pointer;padding:4px}
.admin-link:hover{opacity:1;text-decoration:underline}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0a1430;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:80;box-shadow:0 20px 40px -20px rgba(0,0,0,.6);max-width:calc(100vw - 32px)}

#admin{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);z-index:60;display:flex;flex-direction:column;background:var(--s-card);color:var(--s-ink);border-left:1px solid var(--s-rule);box-shadow:-30px 0 60px -40px rgba(0,0,0,.5);font-size:14.5px;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
body.admin-on #app{margin-right:min(560px,100%)}
body.admin-peek #admin{transform:translateX(calc(100% - 56px))}
body.admin-peek #app{margin-right:56px}
#admin{transition:transform .25s}
.ad-top{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--s-rule);flex-wrap:wrap}
.ad-top h2{font-family:var(--f-display);font-size:20px;font-weight:800;margin-right:auto}
.ad-btn{font:600 13.5px var(--f-body);padding:9px 14px;border-radius:10px;border:1px solid var(--s-rule);background:var(--s-card);color:var(--s-ink);cursor:pointer}
.ad-btn:hover{border-color:var(--s-blue)}
.ad-btn.pri{background:#2457f5;border-color:#2457f5;color:#fff}
.ad-btn.pri:disabled{opacity:.5;cursor:default}
.ad-btn.sm{padding:6px 10px;font-size:12.5px}
.ad-btn.danger{color:#c62828}
.ad-msg{padding:10px 16px;font-size:13px;color:var(--s-ink-2);border-bottom:1px solid var(--s-rule);background:var(--s-soft)}
.ad-msg:empty{display:none}
.ad-tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--s-rule);flex:none}
.ad-tabs button{flex:none;font:600 12.5px var(--f-body);padding:7px 12px;border-radius:999px;border:1px solid var(--s-rule);background:transparent;color:var(--s-ink-2);cursor:pointer}
.ad-tabs button[aria-pressed="true"]{background:var(--s-ink);color:var(--s-card);border-color:var(--s-ink)}
.ad-body{flex:1;overflow-y:auto;padding:18px 16px 40px;display:grid;gap:14px;align-content:start}
.ad-help{font-size:12.5px;color:var(--s-ink-2);background:var(--s-soft);border-radius:10px;padding:10px 12px;line-height:1.5}
.ad-help code{font-family:var(--f-mono);font-size:12px}
.fld{display:grid;gap:6px}
.fld > label,.fld > .fl{font-weight:600;font-size:13px}
.fld input[type=text],.fld input[type=url],.fld textarea,.fld select{width:100%;font:15px var(--f-body);padding:9px 11px;border-radius:9px;border:1px solid var(--s-rule);background:var(--s-card);color:var(--s-ink)}
.fld textarea{min-height:84px;resize:vertical;line-height:1.5}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:2px solid #2457f5;outline-offset:0;border-color:transparent}
.fld input[type=color]{width:48px;height:34px;border:1px solid var(--s-rule);border-radius:8px;background:none;padding:2px}
.chk{display:flex;gap:8px;align-items:center;font-weight:600;font-size:13px}
.strs{display:grid;gap:6px}
.strrow{display:grid;grid-template-columns:1fr auto auto auto;gap:4px}
.lst{display:grid;gap:10px}
.item-card{border:1px solid var(--s-rule);border-radius:12px;overflow:hidden}
.item-card > summary{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;font-weight:600;background:var(--s-soft);list-style:none}
.item-card > summary::-webkit-details-marker{display:none}
.item-card > summary span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-card > .inner{padding:12px;display:grid;gap:12px}
.img-fld{display:grid;gap:8px}
.img-prev{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.img-prev figure{margin:0;position:relative;border:1px solid var(--s-rule);border-radius:9px;overflow:hidden;background:repeating-conic-gradient(#e7ebf5 0 25%,#fff 0 50%) 0 0/14px 14px;aspect-ratio:16/10}
.img-prev img{width:100%;height:100%;object-fit:contain;display:block}
.img-prev figure div{position:absolute;right:4px;top:4px;display:flex;gap:3px}
.img-prev figure button{font:600 11px var(--f-body);border:0;border-radius:6px;padding:3px 6px;background:rgba(10,20,48,.85);color:#fff;cursor:pointer}
.ad-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ad-size{font-family:var(--f-mono);font-size:11.5px;color:var(--s-ink-2)}
.ad-login{display:grid;gap:14px;padding:22px 16px;align-content:start}
.ad-login p{margin:0;font-size:13.5px;color:var(--s-ink-2);line-height:1.5}
.ad-login input[type=password]{width:100%;font:15px var(--f-body);padding:10px 12px;border-radius:9px;border:1px solid var(--s-rule);background:var(--s-card);color:var(--s-ink)}
.ad-login input:focus{outline:2px solid #2457f5;outline-offset:0;border-color:transparent}
.ad-login .ad-err{color:#c62828;font-size:13px}
.ad-login .ad-err:empty{display:none}
@media (max-width:760px){body.admin-on #app{margin-right:0}}
</style>

  /* ================= motion (Framer Motion's vanilla API) ================= */
  function runMotion(){
    const M=window.Motion;if(!M||reduce)return;
    const {animate,inView,scroll,stagger,hover}=M;
    const spring={type:'spring',stiffness:320,damping:22};
    animate('.hero-l > *',{y:[28,0],opacity:[.35,1]},{delay:stagger(.08),duration:.7,ease:[.22,1,.36,1]});
    animate('.hero-r img',{y:[40,0],scale:[.96,1]},{duration:.9,ease:[.22,1,.36,1]});
    animate('.slab',{scaleY:[.7,1]},{duration:1,ease:[.22,1,.36,1]});
    animate('.tagnote',{rotate:[-12,3],scale:[.8,1]},{...spring,delay:.6});
    document.querySelectorAll('.shape').forEach((el,i)=>{
      const m=el.dataset.m;
      if(m==='f')animate(el,{y:[0,-16,0],rotate:[0,i%2?14:-14,0]},{duration:6+(i%5),repeat:Infinity,ease:'easeInOut',delay:(i%4)*.4});
      if(m==='s')animate(el,{rotate:i%2?-360:360},{duration:50+(i%3)*12,repeat:Infinity,ease:'linear'});
      if(m==='p'){const sec=el.closest('section');scroll(animate(el,{y:[-60,60],rotate:[0,40]}),{target:sec,offset:['start end','end start']});}
    });
    scroll(animate('.surname',{y:[0,90]}),{target:$('.hero'),offset:['start start','end start']});
    document.querySelectorAll('section.s').forEach(sec=>{const w=sec.querySelector(':scope > .wrap');if(w)scroll(animate(w,{y:[70,0],opacity:[.5,1]},{ease:'linear'}),{target:sec,offset:['start end','start 35%']})});
    inView('.s-head',el=>{animate(el.children,{y:[30,0],opacity:[.3,1]},{delay:stagger(.1),duration:.7,ease:[.22,1,.36,1]})},{amount:.4});
    inView('.tiles',el=>{animate(el.children,{y:[24,0],scale:[.94,1],opacity:[.3,1]},{delay:stagger(.05),...spring})},{amount:.3});
    inView('.work',el=>{animate(el.children,{y:[50,0],opacity:[.3,1]},{delay:stagger(.12),duration:.8,ease:[.22,1,.36,1]})},{amount:.15});
    inView('.shift',el=>{animate(el.children,{x:[-24,0],opacity:[.3,1]},{delay:stagger(.1),duration:.6})},{amount:.3});
    inView('.statement blockquote',el=>{animate(el,{y:[30,0],opacity:[.3,1]},{duration:.9,ease:[.22,1,.36,1]})});

        const sumText=el('span',{text:item[opt.title]||'(untitled)'});
        const card=el('details',{class:'item-card'});if(i===openIdx)card.open=true;
        const ctrl=(t,title,fn,cls)=>el('button',{type:'button',class:'ad-btn sm'+(cls?' '+cls:''),text:t,title,onclick:e=>{e.preventDefault();e.stopPropagation();fn()}});
        card.append(el('summary',{},[sumText,
          ctrl('↑','Move up',()=>{if(i>0){const a=obj[key];[a[i-1],a[i]]=[a[i],a[i-1]];changed();draw(i-1)}}),
          ctrl('↓','Move down',()=>{const a=obj[key];if(i<a.length-1){[a[i+1],a[i]]=[a[i],a[i+1]];changed();draw(i+1)}}),
          ctrl('Delete','Delete',()=>{if(card.dataset.confirm){obj[key].splice(i,1);changed();draw()}else{card.dataset.confirm='1';sumText.textContent='Click Delete again to remove';setTimeout(()=>{delete card.dataset.confirm;sumText.textContent=item[opt.title]||'(untitled)'},2500)}},'danger')]));
        const inner=el('div',{class:'inner'});
        opt.f.forEach(([k,l,t,o])=>{const fl=field(item,k,l,t,o);if(k===opt.title)fl.addEventListener('input',()=>{sumText.textContent=item[k]||'(untitled)'});inner.append(fl)});
        card.append(inner);box.append(card)});
        box.append(el('div',{class:'ad-row'},[el('button',{type:'button',class:'ad-btn sm',text:'+ Add '+label.toLowerCase().replace(/s?\s*\(.*$/,'').replace(/s$/,''),onclick:()=>{obj[key].push(JSON.parse(JSON.stringify(opt.add)));changed();draw(obj[key].length-1)}})]))};
      wrap.append(el('span',{class:'fl',text:label}),box);draw()}
    return wrap;
  }

  function drawTab(){
    const body=$('#adBody');body.innerHTML='';
    body.append(el('div',{class:'ad-help'},[]));
    body.firstChild.innerHTML='Formatting: <code>**bold**</code> · <code>*blue accent*</code> · <code>[[highlight]]</code> · a new line becomes a line break. Changes show on the page as you type.';
    S[tab].f.forEach(([k,l,t,o])=>body.append(field(C[tab],k,l,t,o)));
    document.querySelectorAll('.ad-tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===tab?'true':'false'));
  }

  function openAdmin(){
    if(adminEl){document.body.classList.remove('admin-peek');return}
    const hosted=!inClaude&&!offline;
    if(hosted&&!token()){showLogin();return}
    const draft=store.get(DRAFT_KEY);let restored=false;
    if(draft&&draft!==JSON.stringify(ORIGINAL)){try{C=JSON.parse(draft);restored=true;render()}catch(e){}}
    else if(draft)store.del(DRAFT_KEY);
    adminEl=el('aside',{id:'admin','aria-label':'Site editor'});
    adminEl.innerHTML='<div class="ad-top"><h2>Edit site</h2><button type="button" class="ad-btn" id="adPeek">Preview</button><button type="button" class="ad-btn" id="adExport">Download site file</button><button type="button" class="ad-btn pri" id="adPublish">Publish</button><button type="button" class="ad-btn" id="adClose" aria-label="Close editor">✕</button></div>'+
      '<div class="ad-msg" id="adMsg"></div><div class="ad-tabs">'+Object.keys(S).map(k=>'<button type="button" data-t="'+k+'">'+S[k].t+'</button>').join('')+'</div>'+
      '<div class="ad-body" id="adBody"></div><div style="padding:10px 16px;border-top:1px solid var(--s-rule);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><span class="ad-size" id="adSize"></span><span class="ad-row">'+(hosted?'<button type="button" class="ad-btn sm" id="adOut">Sign out</button>':'')+'<button type="button" class="ad-btn sm danger" id="adDiscard">Discard draft</button></span></div>';
    document.body.appendChild(adminEl);document.body.classList.add('admin-on');
    adminEl.querySelector('.ad-tabs').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b){tab=b.dataset.t;drawTab()}});
    $('#adClose').onclick=closeAdmin;
    $('#adPeek').onclick=()=>{const on=document.body.classList.toggle('admin-peek');$('#adPeek').textContent=on?'Edit':'Preview'};
    $('#adPublish').onclick=publish;$('#adExport').onclick=exportFile;
    $('#adDiscard').onclick=()=>{const b=$('#adDiscard');if(b.dataset.c){store.del(DRAFT_KEY);C=JSON.parse(JSON.stringify(ORIGINAL));dirty=false;render();drawTab();updateSize();setMsg('Draft discarded. Showing the published version.');delete b.dataset.c;b.textContent='Discard draft'}else{b.dataset.c='1';b.textContent='Click again to discard'}};
    if(hosted){
      $('#adOut').onclick=()=>{signOut();closeAdmin();toast('Signed out.')};
      api('session').then(r=>{if(r.status===401&&adminEl){signOut();showLogin('Your session has ended. Sign in again; your draft is kept on this device.')}}).catch(()=>{});
    }
    drawTab();updateSize();
    setMsg(restored?'Restored your unpublished draft from this device.':(inClaude?(art?'Edit any section, then Publish to update the live page.':'Publishing is not available in this view. Use Download site file to keep your changes.'):
      offline?'Editing offline (sign-in only works on the live site or under netlify dev). Use Download site file to keep your changes.':'Signed in. Edit any section, then Publish to update the live site.'));
    if(inClaude?!art:offline)$('#adPublish').disabled=true;
  }
  function closeAdmin(){if(!adminEl)return;adminEl.remove();adminEl=null;document.body.classList.remove('admin-on','admin-peek')}

  async function publishHosted(){
    const btn=$('#adPublish');
    if(new Blob([JSON.stringify(C)]).size>HOSTED_MAX){setMsg('The content is over 5 MB. Remove or replace some large images, then publish again.');return}
    btn.disabled=true;btn.textContent='Publishing…';setMsg('Publishing…');
    store.set(DRAFT_KEY,JSON.stringify(C));
    try{
      const {status,data}=await api('publish',{content:C});
      if(status===200){dirty=false;setMsg('Published. Netlify is rebuilding the site; your changes will be live in about a minute.');toast('Published.')}
      else if(status===401){signOut();showLogin('Your session has ended. Sign in again, then Publish. Your changes are kept.');return}
      else setMsg(status===429?'Too many requests. Wait a minute, then try again.':status===413?'The content is too large. Remove or shrink some images, then publish again.':(data.error||'Publishing failed ('+status+'). Your changes are still here; try again.'));
    }catch(err){setMsg('Could not reach the server. Your changes are still here; try again.')}
    btn.disabled=false;btn.textContent='Publish';
  }
  async function publish(){
    if(!inClaude)return publishHosted();
    if(!art)return;const btn=$('#adPublish');
    const html=buildPage(C);
    if(html.length>16*1048576){setMsg('The page is over 16 MB. Remove or replace some large images, then publish again.');return}
    btn.disabled=true;btn.textContent='Publishing…';setMsg('Publishing…');
    store.set(DRAFT_KEY,JSON.stringify(C));sess.set('ll-published',JSON.stringify(C).length+'');sess.set('ll-admin-open','1');
    try{await art.publish(html);setMsg('Published. Reloading…')}
    catch(err){
      sess.del('ll-published');sess.del('ll-admin-open');btn.disabled=false;btn.textContent='Publish';
      const code=err&&err.code;
      setMsg(code==='conflict'?'A newer version was published elsewhere. The page will reload; your draft is kept on this device.':
        code==='not_writer'||code==='not_granted'?'Only the site owner or an editor can publish. Use Download site file instead.':
        code==='too_large'?'The page is too large. Remove or shrink some images, then publish again.':
        code==='rate_limited'?'Publishing too often. Wait a minute, then try again.':'Publishing failed. Your changes are still here; try again.');
    }
  }
  async function exportFile(){
    const html=buildPage(C);
    if(dl){try{await dl.save({filename:'index.html',data:html});setMsg('Site file saved. Upload it to your host as index.html.')}catch(err){if(!(err&&err.code==='declined'))setMsg('The file could not be saved here.')}return}
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='index.html';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
    setMsg('Site file downloaded. Upload it to your host as index.html.');
  }

  /* ================= boot ================= */
  render();runMotion();
  if(sess.get('ll-published')){sess.del('ll-published');const d=store.get(DRAFT_KEY);if(d&&d===JSON.stringify(ORIGINAL)){store.del(DRAFT_KEY)}toast('Published. Your changes are live.')}
  if(!inClaude&&location.hash==='#admin')openAdmin();
  addEventListener('hashchange',()=>{if(location.hash==='#admin'&&adminVisible)openAdmin()});
})();
</script>
</body>
</html>
