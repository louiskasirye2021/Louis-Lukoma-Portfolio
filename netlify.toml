# Static site: no build step, publish the project root.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Sign-in and publishing for the site editor (see README).
[functions]
  directory = "netlify/functions"

# The function source sits inside the published folder; don't serve it as a file.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
